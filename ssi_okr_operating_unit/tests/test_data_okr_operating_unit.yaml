scenarios:
  - name: "OKR with Operating Unit - Create objective with operating unit"
    steps:
      - step: "Get unit of measure"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom"

      - step: "Get main company operating unit"
        action: "search"
        model: "operating.unit"
        domain: [["company_id", "=", "REF: base.main_company"]]
        save_as: "operating_unit"
        limit: 1

      - step: "Create OKR Objective with Operating Unit"
        action: "create"
        model: "okr_objective"
        save_as: "objective"
        as_user: "base.user_admin"
        values:
          objective: "OKR with OU"
          date_start: 2026-01-01
          date_end: 2026-12-31
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Assert objective has operating unit"
        action: "assert"
        target: "objective"
        asserts:
          state:
            type: "value"
            expected: "draft"
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

      - step: "Create Key Result with Operating Unit"
        action: "create"
        model: "okr_key_result"
        save_as: "key_result"
        as_user: "base.user_admin"
        values:
          objective_id: "EVAL: registry['objective'].id"
          key_result: "Key Result with OU"
          date_deadline: 2026-12-31
          target_value: 100.0
          uom_id: "EVAL: registry['uom'].id"
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Assert key result has operating unit"
        action: "assert"
        target: "key_result"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"
